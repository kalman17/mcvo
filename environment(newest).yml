name: anycam
channels:
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - cuda-toolkit=12.9
  - pip
  - pip:
      # Let pip pick the newest compatible versions automatically
      - torch
      - torchvision
      - torchaudio
      - --extra-index-url https://download.pytorch.org/whl/cu128   # forces latest CUDA 12.8 wheels

      # Everything else — no versions at all (except the local editable one)
      - -e anycalib
      - absl-py
      - accelerate
      - addict
      - annotated-types
      - antlr4-python3-runtime
      - argcomplete
      - attrs
      - blinker
      - certifi
      - charset-normalizer
      - click
      - colorama
      - configargparse
      - contourpy
      - cycler
      - dash
      - decorator
