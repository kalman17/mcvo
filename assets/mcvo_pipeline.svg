<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="600" viewBox="0 0 1340 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c2410c"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/></marker>
    <style>
      .t{fill:#111827}.s{fill:#6b7280;font-size:11.5px}.h{font-weight:bold}
      .w{stroke:#374151;stroke-width:1.8;fill:none}
      .b{stroke:#b45309;stroke-width:1.6;fill:none}
      .o{stroke:#c2410c;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .g{stroke:#15803d;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1340" height="600" fill="#ffffff"/>

  <!-- ================= INFERENCE ================= -->
  <text x="24" y="30" class="t h" font-size="15">Inference — images in; poses, uncertainty and intrinsics out</text>

  <!-- frames -->
  <rect x="24" y="66" width="72" height="54" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="34" y="76" width="72" height="54" rx="4" fill="#cfd4da" stroke="#9ca3af"/>
  <rect x="44" y="86" width="72" height="54" rx="4" fill="#9ca3af" stroke="#6b7280"/>
  <rect x="54" y="96" width="72" height="54" rx="4" fill="#6b7280" stroke="#4b5563"/>
  <text x="75" y="172" text-anchor="middle" class="t">N frames</text>
  <text x="75" y="188" text-anchor="middle" class="s">336×336 RGB, [0,1]</text>
  <path class="w" d="M132 116 H176" marker-end="url(#a)"/>

  <!-- backbone -->
  <rect x="180" y="80" width="130" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="245" y="106" text-anchor="middle" class="h" fill="#3730a3">DINOv2-base</text>
  <text x="245" y="124" text-anchor="middle" class="s">frozen · 86 M</text>
  <text x="245" y="140" text-anchor="middle" class="s">576 patch tokens / frame</text>
  <path class="w" d="M310 116 H354" marker-end="url(#a)"/>

  <!-- decoder -->
  <rect x="358" y="52" width="440" height="128" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="578" y="74" text-anchor="middle" class="h" fill="#14532d">Decoder · 10 blocks · 67 M trained</text>
  <text x="578" y="90" text-anchor="middle" class="s">+ one learned camera token per frame · temporal position embedding</text>
  <rect x="374" y="102" width="124" height="64" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="436" y="124" text-anchor="middle" class="h" fill="#14532d" font-size="12">temporal attention</text>
  <text x="436" y="140" text-anchor="middle" class="s">each patch position</text>
  <text x="436" y="154" text-anchor="middle" class="s">across the N frames</text>
  <path class="w" d="M498 134 H512" marker-end="url(#a)"/>
  <rect x="516" y="102" width="124" height="64" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="578" y="124" text-anchor="middle" class="h" fill="#14532d" font-size="12">spatial attention</text>
  <text x="578" y="140" text-anchor="middle" class="s">within a frame,</text>
  <text x="578" y="154" text-anchor="middle" class="s">camera token included</text>
  <path class="w" d="M640 134 H654" marker-end="url(#a)"/>
  <rect x="658" y="102" width="124" height="64" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="720" y="130" text-anchor="middle" class="h" fill="#14532d" font-size="12">MLP</text>
  <text x="720" y="150" text-anchor="middle" class="s">per token · ×10</text>
  <text x="358" y="206" class="s">cost per 4-frame window on an A40: <tspan class="h" fill="#111827">75 ms · 0.69 GiB</tspan> · 154 M parameters total</text>

  <!-- bus from decoder to the three heads (side by side) -->
  <path class="w" d="M798 116 H826 V40 H1236"/>
  <path class="w" d="M905 40 V60" marker-end="url(#a)"/>
  <path class="w" d="M1070 40 V60" marker-end="url(#a)"/>
  <path class="w" d="M1236 40 V60" marker-end="url(#a)"/>

  <!-- heads: box = title / what it reads / what it outputs -->
  <rect x="830" y="64" width="150" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="905" y="84" text-anchor="middle" class="h" fill="#9a3412">pose head</text>
  <text x="905" y="101" text-anchor="middle" class="s">cam tokens (i, i+1)</text>
  <text x="905" y="118" text-anchor="middle" class="t" font-size="12">→ N−1 relative poses</text>
  <text x="905" y="132" text-anchor="middle" class="s">R, t: cam_i → cam_{i+1}</text>

  <rect x="995" y="64" width="150" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="1070" y="84" text-anchor="middle" class="h" fill="#9a3412">uncertainty head</text>
  <text x="1070" y="101" text-anchor="middle" class="s">patch tokens</text>
  <text x="1070" y="118" text-anchor="middle" class="t" font-size="12">→ per-pixel σ maps</text>
  <text x="1070" y="132" text-anchor="middle" class="s">down-weight moving pixels</text>

  <rect x="1161" y="64" width="150" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="1236" y="84" text-anchor="middle" class="h" fill="#9a3412">calibration head</text>
  <text x="1236" y="101" text-anchor="middle" class="s">camera token</text>
  <text x="1236" y="118" text-anchor="middle" class="t" font-size="12">→ intrinsics per frame</text>
  <text x="1236" y="132" text-anchor="middle" class="s">focal length, principal point</text>

  <!-- ================= CONNECTORS (heads -> loss; loss -> decoder) ================= -->
  <path class="o" d="M905 140 V348" marker-end="url(#ao)"/>
  <text x="912" y="292" class="s" fill="#9a3412">predicted pose</text>
  <path class="o" d="M1070 140 V348" marker-end="url(#ao)"/>
  <text x="1077" y="292" class="s" fill="#9a3412">predicted σ</text>
  <path class="o" d="M1236 140 V270 H1290 V348" marker-end="url(#ao)"/>
  <text x="1243" y="220" class="s" fill="#9a3412">predicted f</text>
  <!-- gradient: from loss up to decoder, hopping over the two verticals -->
  <path class="g" d="M1150 352 V262 H1078 A8 8 0 0 0 1062 262 H913 A8 8 0 0 0 897 262 H720 V184" marker-end="url(#ag)"/>
  <text x="726" y="232" class="s" fill="#15803d">gradients → decoder + heads only</text>
  <text x="726" y="246" class="s" fill="#15803d">(backbone and teachers stay frozen)</text>

  <!-- ================= TRAINING ================= -->
  <rect x="24" y="300" width="1300" height="276" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="40" y="326" class="h" fill="#78350f" font-size="15">Training only — frozen teachers on the loss side, no labels anywhere</text>

  <!-- teachers -->
  <rect x="44" y="352" width="196" height="46" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="142" y="371" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniDepth</text>
  <text x="142" y="388" text-anchor="middle" class="s">monocular depth of frame i</text>
  <rect x="44" y="412" width="196" height="46" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="142" y="431" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniMatch</text>
  <text x="142" y="448" text-anchor="middle" class="s">optical flow i → i+1</text>
  <rect x="44" y="472" width="196" height="46" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="142" y="491" text-anchor="middle" class="h" fill="#78350f" font-size="12">AnyCalib</text>
  <text x="142" y="508" text-anchor="middle" class="s">per-frame intrinsics K</text>
  <text x="142" y="546" text-anchor="middle" class="s">cached once for ~80 k frames</text>

  <!-- teacher wires -->
  <path class="b" d="M240 375 H740 V400 H786" marker-end="url(#ab)"/>
  <text x="256" y="369" class="s" fill="#92400e">depth of frame i</text>
  <path class="b" d="M240 495 H760 V440 H786" marker-end="url(#ab)"/>
  <text x="256" y="489" class="s" fill="#92400e">intrinsics K</text>
  <path class="b" d="M240 435 H300 V546 H1120 V500" marker-end="url(#ab)"/>
  <text x="256" y="429" class="s" fill="#92400e">teacher flow</text>
  <path class="b" d="M700 495 V528 H1250 V500" marker-end="url(#ab)" stroke-dasharray="3 3"/>
  <text x="720" y="522" class="s" fill="#92400e">cached K is also the calibration head's target</text>

  <!-- reprojection block (under the pose head) -->
  <rect x="790" y="352" width="230" height="146" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="905" y="386" text-anchor="middle" class="h" fill="#78350f" font-size="12">unproject frame i with depth &amp; K</text>
  <text x="905" y="406" text-anchor="middle" class="h" fill="#78350f" font-size="12">move by the predicted pose</text>
  <text x="905" y="426" text-anchor="middle" class="h" fill="#78350f" font-size="12">re-project into frame i+1</text>
  <text x="905" y="456" text-anchor="middle" class="s">→ induced flow i → i+1</text>
  <path class="w" d="M1020 425 H1046" marker-end="url(#a)" style="stroke:#b45309"/>

  <!-- loss (under the uncertainty / calibration heads) -->
  <rect x="1050" y="352" width="260" height="146" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="1180" y="384" text-anchor="middle" class="h" fill="#78350f" font-size="12">flow-reprojection loss</text>
  <text x="1180" y="408" text-anchor="middle" fill="#78350f" font-size="13">| induced − teacher flow | / σ + log σ</text>
  <text x="1180" y="430" text-anchor="middle" class="s">Laplacian NLL, weighted by predicted σ;</text>
  <text x="1180" y="444" text-anchor="middle" class="s">occluded / invalid teacher pixels masked</text>
  <text x="1180" y="470" text-anchor="middle" class="s">+ calibration head: L1 to cached log-focal</text>
</svg>
