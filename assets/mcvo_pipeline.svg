<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c2410c"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/></marker>
    <style>
      .t{fill:#111827}.s{fill:#6b7280;font-size:11.5px}.h{font-weight:bold}
      .w{stroke:#374151;stroke-width:1.8;fill:none}
      .b{stroke:#b45309;stroke-width:1.6;fill:none}
      .o{stroke:#c2410c;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .g{stroke:#15803d;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1100" height="470" fill="#ffffff"/>

  <!-- ===== inference ===== -->
  <text x="24" y="30" class="t h" font-size="15">Inference: images in → camera poses and intrinsics out</text>

  <rect x="24" y="66" width="72" height="54" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="34" y="76" width="72" height="54" rx="4" fill="#cfd4da" stroke="#9ca3af"/>
  <rect x="44" y="86" width="72" height="54" rx="4" fill="#9ca3af" stroke="#6b7280"/>
  <rect x="54" y="96" width="72" height="54" rx="4" fill="#6b7280" stroke="#4b5563"/>
  <text x="75" y="172" text-anchor="middle" class="t">N frames</text>
  <text x="75" y="188" text-anchor="middle" class="s">336×336 RGB</text>
  <path class="w" d="M132 116 H176" marker-end="url(#a)"/>

  <rect x="180" y="80" width="130" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="245" y="106" text-anchor="middle" class="h" fill="#3730a3">DINOv2-base</text>
  <text x="245" y="124" text-anchor="middle" class="s">frozen · 86 M</text>
  <text x="245" y="140" text-anchor="middle" class="s">576 patch tokens / frame</text>
  <path class="w" d="M310 116 H354" marker-end="url(#a)"/>

  <rect x="358" y="62" width="330" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="523" y="90" text-anchor="middle" class="h" fill="#14532d">Transformer decoder</text>
  <text x="523" y="110" text-anchor="middle" class="s">10 blocks · 67 M trained</text>
  <text x="523" y="128" text-anchor="middle" class="s">attention across frames, then within each frame</text>
  <text x="523" y="144" text-anchor="middle" class="s">one learned camera token per frame</text>
  <text x="523" y="160" text-anchor="middle" class="s">also predicts a per-pixel uncertainty (used by the loss)</text>

  <path class="w" d="M688 116 H716"/>
  <path class="w" d="M716 86 V146"/>
  <path class="w" d="M716 86 H738" marker-end="url(#a)"/>
  <path class="w" d="M716 146 H738" marker-end="url(#a)"/>

  <rect x="742" y="64" width="150" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="817" y="82" text-anchor="middle" class="h" fill="#9a3412">pose head</text>
  <text x="817" y="99" text-anchor="middle" class="s">camera tokens (i, i+1)</text>
  <rect x="742" y="124" width="150" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="817" y="142" text-anchor="middle" class="h" fill="#9a3412">calibration head</text>
  <text x="817" y="159" text-anchor="middle" class="s">camera token</text>
  <path class="w" d="M892 86 H926" marker-end="url(#a)"/>
  <path class="w" d="M892 146 H926" marker-end="url(#a)"/>
  <text x="932" y="83" class="t h">relative poses R, t</text>
  <text x="932" y="98" class="s">between consecutive frames</text>
  <text x="932" y="143" class="t h">intrinsics f, c</text>
  <text x="932" y="158" class="s">per frame</text>

  <text x="24" y="214" class="s">75 ms · 0.69 GiB per 4-frame window on an A40 · 154 M parameters</text>

  <!-- ===== training ===== -->
  <rect x="24" y="238" width="1052" height="210" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="40" y="264" class="h" fill="#78350f" font-size="15">Training only — no labels; three frozen networks supervise through the loss</text>

  <rect x="44" y="290" width="180" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="134" y="308" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniDepth</text>
  <text x="134" y="323" text-anchor="middle" class="s">depth of frame i</text>
  <rect x="44" y="340" width="180" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="134" y="358" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniMatch</text>
  <text x="134" y="373" text-anchor="middle" class="s">optical flow i → i+1</text>
  <rect x="44" y="390" width="180" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="134" y="408" text-anchor="middle" class="h" fill="#78350f" font-size="12">AnyCalib</text>
  <text x="134" y="423" text-anchor="middle" class="s">intrinsics of frame i</text>

  <path class="b" d="M224 310 H300" marker-end="url(#ab)"/>
  <path class="b" d="M224 360 H300" marker-end="url(#ab)"/>
  <path class="b" d="M224 410 H300" marker-end="url(#ab)"/>

  <rect x="304" y="290" width="520" height="140" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="564" y="316" text-anchor="middle" class="h" fill="#78350f" font-size="13">flow-reprojection loss</text>
  <text x="564" y="340" text-anchor="middle" fill="#78350f" font-size="12">unproject frame i with its depth and intrinsics, move the points by the predicted pose,</text>
  <text x="564" y="356" text-anchor="middle" fill="#78350f" font-size="12">re-project into frame i+1 → compare with the teacher flow, pixel by pixel,</text>
  <text x="564" y="372" text-anchor="middle" fill="#78350f" font-size="12">weighted by the predicted uncertainty (moving objects are down-weighted)</text>
  <text x="564" y="400" text-anchor="middle" class="s">+ the calibration head is trained to reproduce the cached AnyCalib intrinsics</text>
  <text x="564" y="416" text-anchor="middle" class="s">teachers cached once for ~80 k frames; gradients reach only the decoder and heads</text>

  <!-- predicted pose / f down into the loss; gradient back up -->
  <path class="o" d="M817 108 V116 H720 V286" marker-end="url(#ao)"/>
  <path class="o" d="M817 168 V200 H760 V286" marker-end="url(#ao)"/>
  <text x="726" y="216" class="s" fill="#9a3412">predicted pose, intrinsics</text>
  <path class="g" d="M640 290 V220 H600 V174" marker-end="url(#ag)"/>
  <text x="646" y="216" class="s" fill="#15803d">gradients</text>
</svg>
