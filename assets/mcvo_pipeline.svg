<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="508" viewBox="0 0 1100 508" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c2410c"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/></marker>
    <style>
      .t{fill:#111827}.s{fill:#6b7280;font-size:11.5px}.h{font-weight:bold}
      .w{stroke:#374151;stroke-width:1.8;fill:none}
      .b{stroke:#b45309;stroke-width:1.6;fill:none}
      .o{stroke:#c2410c;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .g{stroke:#15803d;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1100" height="508" fill="#ffffff"/>

  <!-- ===== inference ===== -->
  <text x="24" y="30" class="t h" font-size="15">Inference: images in → camera poses and intrinsics out</text>

  <rect x="24" y="66" width="72" height="54" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <rect x="34" y="76" width="72" height="54" rx="4" fill="#cfd4da" stroke="#9ca3af"/>
  <rect x="44" y="86" width="72" height="54" rx="4" fill="#9ca3af" stroke="#6b7280"/>
  <rect x="54" y="96" width="72" height="54" rx="4" fill="#6b7280" stroke="#4b5563"/>
  <text x="75" y="172" text-anchor="middle" class="t">N frames</text>
  <text x="75" y="188" text-anchor="middle" class="s">336×336 RGB</text>
  <path class="w" d="M132 116 H176" marker-end="url(#a)"/>

  <rect x="180" y="80" width="130" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="245" y="106" text-anchor="middle" class="h" fill="#3730a3">DINOv2-base</text>
  <text x="245" y="124" text-anchor="middle" class="s">frozen · 86 M</text>
  <text x="245" y="140" text-anchor="middle" class="s">576 patch tokens / frame</text>
  <path class="w" d="M310 116 H354" marker-end="url(#a)"/>

  <rect x="358" y="62" width="330" height="108" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="523" y="90" text-anchor="middle" class="h" fill="#14532d">Transformer decoder</text>
  <text x="523" y="110" text-anchor="middle" class="s">10 blocks · 67 M trained</text>
  <text x="523" y="128" text-anchor="middle" class="s">attention across frames, then within each frame</text>
  <text x="523" y="144" text-anchor="middle" class="s">one learned camera token per frame</text>
  <text x="523" y="160" text-anchor="middle" class="s">also predicts a per-pixel uncertainty (used only by the loss)</text>

  <path class="w" d="M688 116 H716"/>
  <path class="w" d="M716 86 V146"/>
  <path class="w" d="M716 86 H738" marker-end="url(#a)"/>
  <path class="w" d="M716 146 H738" marker-end="url(#a)"/>

  <rect x="742" y="64" width="150" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="817" y="82" text-anchor="middle" class="h" fill="#9a3412">calibration head</text>
  <text x="817" y="99" text-anchor="middle" class="s">camera token</text>
  <rect x="742" y="124" width="150" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="817" y="142" text-anchor="middle" class="h" fill="#9a3412">pose head</text>
  <text x="817" y="159" text-anchor="middle" class="s">camera tokens (i, i+1)</text>
  <path class="w" d="M892 86 H926" marker-end="url(#a)"/>
  <path class="w" d="M892 146 H926" marker-end="url(#a)"/>
  <text x="932" y="83" class="t h">intrinsics f, c</text>
  <text x="932" y="98" class="s">per frame</text>
  <text x="932" y="143" class="t h">relative poses R, t</text>
  <text x="932" y="158" class="s">between consecutive frames</text>

  <text x="24" y="214" class="s">75 ms · 0.69 GiB per 4-frame window on an A40 · 154 M parameters</text>

  <g transform="translate(0,28)">
  <!-- ===== training ===== -->
  <rect x="24" y="238" width="1052" height="232" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="40" y="264" class="h" fill="#78350f" font-size="15">Training only — no labels; three frozen networks supervise through the loss</text>

  <!-- teachers -->
  <rect x="44" y="290" width="150" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="119" y="308" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniDepth</text>
  <text x="119" y="323" text-anchor="middle" class="s">depth of frame i</text>
  <rect x="44" y="340" width="150" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="119" y="358" text-anchor="middle" class="h" fill="#78350f" font-size="12">AnyCalib</text>
  <text x="119" y="373" text-anchor="middle" class="s">intrinsics K</text>
  <rect x="44" y="390" width="150" height="40" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="119" y="408" text-anchor="middle" class="h" fill="#78350f" font-size="12">UniMatch</text>
  <text x="119" y="423" text-anchor="middle" class="s">optical flow i → i+1</text>
  <text x="119" y="452" text-anchor="middle" class="s">cached once, ~80 k frames</text>

  <!-- step 1: unproject -->
  <path class="b" d="M194 310 H236 V318 H254" marker-end="url(#ab)"/>
  <path class="b" d="M194 360 H236 V342 H254" marker-end="url(#ab)"/>
  <rect x="258" y="298" width="150" height="64" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="333" y="320" text-anchor="middle" class="h" fill="#78350f" font-size="12">1 · unproject</text>
  <text x="333" y="337" text-anchor="middle" class="s">pixels of frame i → 3D points</text>
  <text x="333" y="352" text-anchor="middle" class="s">using depth and K</text>
  <path class="b" d="M408 330 H436" marker-end="url(#ab)"/>

  <!-- step 2: move by predicted pose -->
  <rect x="440" y="298" width="150" height="64" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="515" y="320" text-anchor="middle" class="h" fill="#78350f" font-size="12">2 · move</text>
  <text x="515" y="337" text-anchor="middle" class="s">apply the predicted</text>
  <text x="515" y="352" text-anchor="middle" class="s">pose i → i+1</text>
  <path class="b" d="M590 330 H618" marker-end="url(#ab)"/>

  <!-- step 3: project -->
  <rect x="622" y="298" width="150" height="64" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="697" y="320" text-anchor="middle" class="h" fill="#78350f" font-size="12">3 · re-project</text>
  <text x="697" y="337" text-anchor="middle" class="s">into frame i+1</text>
  <text x="697" y="352" text-anchor="middle" class="s">→ induced flow</text>
  <path class="b" d="M772 330 H800" marker-end="url(#ab)"/>

  <!-- step 4: compare -->
  <rect x="804" y="290" width="250" height="80" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <text x="929" y="312" text-anchor="middle" class="h" fill="#78350f" font-size="12">4 · compare = the loss</text>
  <text x="929" y="330" text-anchor="middle" class="s">| induced flow − teacher flow | per pixel,</text>
  <text x="929" y="345" text-anchor="middle" class="s">weighted by the predicted uncertainty</text>
  <text x="929" y="360" text-anchor="middle" class="s">(moving objects are down-weighted)</text>
  <!-- teacher flow into step 4 along the bottom -->
  <path class="b" d="M194 410 H860 V374" marker-end="url(#ab)"/>
  <text x="600" y="404" class="s" fill="#92400e">teacher flow</text>

  <!-- calibration target -->
  <text x="258" y="446" class="s" fill="#92400e">+ the calibration head is trained to reproduce the cached K (L1 on log-focal) — same teacher, no extra data</text>

  </g>
  <!-- predicted pose -> step 2 ; gradients back (one hop over the pose line) -->
  <path class="o" d="M817 168 V226 H515 V322" marker-end="url(#ao)"/>
  <text x="522" y="220" class="s" fill="#9a3412">predicted pose</text>
  <path class="g" d="M1054 358 H1064 V248 H523 A8 8 0 0 0 507 248 H440 V174" marker-end="url(#ag)"/>
  <text x="640" y="243" class="s" fill="#15803d">gradients → decoder + heads only</text>
</svg>
